[project]
name = "slackbot-hr-ops"
version = "0.1.0"
description = "HR Operations Slackbot with Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "slack-sdk>=3.27.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "flask>=3.0.0",
    "gunicorn>=21.0.0",
    "claude-agent-sdk>=0.1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
